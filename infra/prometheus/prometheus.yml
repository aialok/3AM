# Scrapes the blog's same-server /metrics endpoint.
# NOTE: target assumes default BLOG_PORT=3000. If you change BLOG_PORT,
# update the target below to blog:<BLOG_PORT>.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alert.rules.yml

scrape_configs:
  - job_name: blog
    static_configs:
      - targets: ['blog:3000']
