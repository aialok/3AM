# Grafana-managed alert rules (same PromQL as Prometheus alert.rules.yml).
# These own the webhook → 3AM auto-trigger path via the 3am-webhook contact point.
apiVersion: 1
groups:
  - orgId: 1
    name: blog-alerts
    folder: 3AM
    interval: 30s
    rules:
      - uid: high-latency
        title: HighLatency
        condition: C
        for: 1m
        noDataState: NoData
        execErrState: Error
        labels:
          severity: page
          service: blog
        annotations:
          summary: 'Blog p95 latency above 0.8s'
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              datasource: { type: prometheus, uid: prometheus }
              expr: histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket[2m])))
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              refId: B
              datasource: { type: __expr__, uid: __expr__ }
              type: reduce
              expression: A
              reducer: last
          - refId: C
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              refId: C
              datasource: { type: __expr__, uid: __expr__ }
              type: threshold
              expression: B
              conditions:
                - evaluator: { params: [0.8], type: gt }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { params: [], type: last }
                  type: query

      - uid: high-error-rate
        title: HighErrorRate
        condition: C
        for: 1m
        noDataState: NoData
        execErrState: Error
        labels:
          severity: page
          service: blog
        annotations:
          summary: 'Blog 5xx rate above 5%'
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              datasource: { type: prometheus, uid: prometheus }
              expr: sum(rate(http_requests_total{status=~"5.."}[2m])) / sum(rate(http_requests_total[2m]))
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              refId: B
              datasource: { type: __expr__, uid: __expr__ }
              type: reduce
              expression: A
              reducer: last
          - refId: C
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              refId: C
              datasource: { type: __expr__, uid: __expr__ }
              type: threshold
              expression: B
              conditions:
                - evaluator: { params: [0.05], type: gt }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { params: [], type: last }
                  type: query

      - uid: db-pool-exhausted
        title: DbPoolExhausted
        condition: C
        for: 1m
        noDataState: NoData
        execErrState: Error
        labels:
          severity: page
          service: blog
        annotations:
          summary: 'Requests waiting for a Postgres connection'
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              datasource: { type: prometheus, uid: prometheus }
              expr: db_pool_waiting
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              refId: B
              datasource: { type: __expr__, uid: __expr__ }
              type: reduce
              expression: A
              reducer: last
          - refId: C
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              refId: C
              datasource: { type: __expr__, uid: __expr__ }
              type: threshold
              expression: B
              conditions:
                - evaluator: { params: [0], type: gt }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { params: [], type: last }
                  type: query

      - uid: traffic-spike
        title: TrafficSpike
        condition: C
        for: 1m
        noDataState: NoData
        execErrState: Error
        labels:
          severity: warn
          service: blog
        annotations:
          summary: 'Blog traffic above 5 RPS'
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              datasource: { type: prometheus, uid: prometheus }
              expr: sum(rate(http_requests_total[2m]))
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              refId: B
              datasource: { type: __expr__, uid: __expr__ }
              type: reduce
              expression: A
              reducer: last
          - refId: C
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              refId: C
              datasource: { type: __expr__, uid: __expr__ }
              type: threshold
              expression: B
              conditions:
                - evaluator: { params: [5], type: gt }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { params: [], type: last }
                  type: query
