# 3AM demo topology: app runs locally, data + observability + notifications on cloud.
# All secrets/URLs come from environment (.env). Nothing hardcoded.
# TrueForge runs separately via `npx @truefoundry/trueforge` (see RUN.md).
# Local-obs files (infra/prometheus, infra/grafana, infra/postgres) are kept
# in repo as reference/fallback but no longer run in compose.

services:
  blog:
    build: ./apps/blog
    environment:
      # Neon (from env). No local postgres to operate.
      DATABASE_URL: ${DATABASE_URL}
      BLOG_PORT: ${BLOG_PORT:-3000}
      SENTRY_DSN: ${SENTRY_DSN:-}
    ports:
      - "${BLOG_PORT:-3000}:${BLOG_PORT:-3000}"

  alloy:
    image: grafana/alloy:v1.7.4
    command: ["run", "--server.http.listen-addr=0.0.0.0:12345", "/etc/alloy/config.alloy"]
    ports:
      - "12345:12345" # Alloy debug UI (pipeline + target health)
    environment:
      GCLOUD_HOSTED_METRICS_URL: ${GCLOUD_HOSTED_METRICS_URL}
      GCLOUD_HOSTED_METRICS_ID: ${GCLOUD_HOSTED_METRICS_ID}
      GCLOUD_RW_API_KEY: ${GCLOUD_RW_API_KEY}
    volumes:
      - ./infra/alloy/config.alloy:/etc/alloy/config.alloy:ro
    depends_on:
      - blog

  3am:
    build: ./apps/3am
    volumes:
      - ./trueforge:/app/trueforge:ro # agent.json: single source of truth for the spec
    environment:
      # TrueForge runs on host via npx (port 8791). Container reaches it via host.docker.internal.
      TRUEFORGE_BASE_URL: http://host.docker.internal:8791
      TRUEFORGE_AGENT_NAME: ${TRUEFORGE_AGENT_NAME:-three-am-investigator}
      TRUEFORGE_MODEL: ${TRUEFORGE_MODEL:-}
      THREE_AM_PORT: ${THREE_AM_PORT:-3001}
      THREE_AM_DATABASE_URL: ${THREE_AM_DATABASE_URL}
      GRAFANA_BASE_URL: ${GRAFANA_BASE_URL:-http://grafana:3000}
      SLACK_BOT_TOKEN: ${SLACK_BOT_TOKEN:-}
      SLACK_CHANNEL_ID: ${SLACK_CHANNEL_ID:-}
      NOTION_TOKEN: ${NOTION_TOKEN:-}
      NOTION_DATABASE_ID: ${NOTION_DATABASE_ID:-}
    ports:
      - "${THREE_AM_PORT:-3001}:${THREE_AM_PORT:-3001}"
    depends_on:
      - blog
      - alloy
    extra_hosts:
      - "host.docker.internal:host-gateway"
